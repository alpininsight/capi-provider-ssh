---
# =============================================================================

# Public-repository exception: GitHub does not allow this public caller to use
# the private organization workflow catalog. Keep this implementation aligned
# with .github-private/changelog-reusable.yml until a public reusable backend
# exists. Access behavior was verified in capi-provider-ssh PR #228.
# Changelog Workflow - Auto-generate CHANGELOG.md on develop
# =============================================================================

name: Changelog

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Generate CHANGELOG.md
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] v7; authenticated push is required
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.CHANGELOG_BOT_TOKEN != '' && secrets.CHANGELOG_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: git-cliff@2.7.0

      - name: Generate changelog
        id: generate
        run: |
          git-cliff --output CHANGELOG.md

          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md updated."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changelog updates."
          fi

      - name: Ensure changelog bot token is configured
        if: steps.generate.outputs.changed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
        run: |
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::Missing CHANGELOG_BOT_TOKEN secret. Configure it in repo Settings > Secrets."
            exit 1
          fi

      - name: Create or update changelog PR
        id: pr
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/changelog-update"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update CHANGELOG.md"
          REMOTE_HEAD="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk '{print $1}')"
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" origin "HEAD:refs/heads/$BRANCH"

          PR_NUM="$(gh pr list --head "$BRANCH" --base develop --json number --jq '.[0].number')"
          if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
            echo "Updating existing PR #$PR_NUM"
            gh pr edit "$PR_NUM" \
              --title "chore(changelog): update CHANGELOG.md" \
              --body "Auto-generated changelog update from git-cliff."
          else
            echo "Creating new PR from $BRANCH to develop"
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore(changelog): update CHANGELOG.md" \
              --body "Auto-generated changelog update from git-cliff."
          fi

          PR_NUM="$(gh pr list --state open --head "$BRANCH" --base develop --json number --jq '.[0].number')"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "::error::Could not resolve changelog PR number."
            exit 1
          fi
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "pr_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for checks and merge the reviewed changelog commit
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD: ${{ steps.pr.outputs.pr_head }}
        run: |
          python3 python/scripts/merge_changelog.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUM" --expected-head "$PR_HEAD"

      - name: Summary
        env:
          CHANGED: ${{ steps.generate.outputs.changed }}
        run: |
          echo "### Changelog workflow result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Changed: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
