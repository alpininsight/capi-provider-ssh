name: CI Python

# Public-repository exception: the private organization workflow catalog is
# not callable from this public repository. Keep generic Python behavior
# aligned with .github-private/python-django-quality-reusable.yml.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality (3.13)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check capi_provider_ssh tests

      - name: Ruff format check
        run: uv run ruff format --check capi_provider_ssh tests

      - name: Pytest with coverage
        env:
          TEARDOWN_ARTIFACT_DIR: ${{ github.workspace }}/python/test-artifacts/teardown
        run: uv run pytest -q --cov=capi_provider_ssh --cov-report=term-missing --cov-report=xml

      - name: Upload Python coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: python/coverage.xml
          if-no-files-found: ignore

      - name: Upload teardown debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: teardown-debug-artifacts
          path: python/test-artifacts/teardown
          if-no-files-found: ignore

  manifests:
    name: Validate CRDs and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          VERSION="0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render manifests
        run: |
          set -euo pipefail
          kubectl kustomize shared/crds > /tmp/shared-crds.yaml
          kubectl kustomize python/deploy > /tmp/python-deploy.yaml

      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -summary -strict -ignore-missing-schemas /tmp/shared-crds.yaml /tmp/python-deploy.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rendered-manifests
          path: |
            /tmp/shared-crds.yaml
            /tmp/python-deploy.yaml
          if-no-files-found: ignore
