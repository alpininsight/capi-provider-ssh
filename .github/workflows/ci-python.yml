name: CI Python

# Public-repository exception: the private organization workflow catalog is
# not callable from this public repository. Keep generic Python behavior
# aligned with .github-private/python-django-quality-reusable.yml.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run every configured file hook
        run: uvx --python 3.14 --from pre-commit==4.6.2 pre-commit run --all-files

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Install git-cliff for release-history regression tests
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: git-cliff@2.14.2

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        env:
          TEARDOWN_ARTIFACT_DIR: ${{ github.workspace }}/python/test-artifacts/teardown
        run: uv run pytest -q -m 'not integration and not e2e and not kind' --cov=capi_provider_ssh --cov-report=term-missing --cov-report=xml

      - name: Upload Python coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: python/coverage.xml
          if-no-files-found: ignore

      - name: Upload teardown debug artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: teardown-debug-artifacts-${{ matrix.python-version }}
          path: python/test-artifacts/teardown
          if-no-files-found: ignore

  kind-lifecycle:
    name: CAPI lifecycle and provider failover
    # Keep the nested kubeadm host on its validated OS; qualify upgrades separately.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.34.11
      - name: Install verified Kind binary
        run: |
          curl --fail --location --retry 3 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind' | sha256sum --check
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: Test real CAPI bootstrap, cleanup, reuse and crash recovery
        run: bash scripts/test-kind-lifecycle.sh
      - name: Upload lifecycle evidence (no Secrets or kubeconfigs)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kind-lifecycle-evidence
          path: python/test-artifacts/kind
          if-no-files-found: error

  manifests:
    name: Validate CRDs and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Install kubeconform
        run: |
          set -euo pipefail
          VERSION="0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render manifests
        run: |
          set -euo pipefail
          kubectl kustomize shared/crds > /tmp/shared-crds.yaml
          kubectl kustomize python/deploy > /tmp/python-deploy.yaml

      - name: Validate manifests
        run: |
          set -euo pipefail
          kubeconform -summary -strict -ignore-missing-schemas /tmp/shared-crds.yaml /tmp/python-deploy.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rendered-manifests
          path: |
            /tmp/shared-crds.yaml
            /tmp/python-deploy.yaml
          if-no-files-found: ignore
