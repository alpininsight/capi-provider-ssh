name: Container Build (Python)

# Public-repository exception: the private organization workflow catalog is
# not callable from this public repository. Keep build, scan, publication, and
# metadata behavior aligned with python-django-container-build-reusable.yml.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish an immutable SHA candidate from a reviewed work branch
        type: boolean
        default: false

concurrency:
  group: container-python-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/alpininsight/capi-provider-ssh-python

jobs:
  validate:
    name: Validate and scan Python container
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./python
          file: ./python/Dockerfile
          build-args: |
            PROVIDER_VERSION=${{ needs.version.outputs.semver }}
          load: true
          push: false
          tags: capi-provider-ssh-python:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify installed runtime and removed package installers
        env:
          EXPECTED_PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
        run: |
          for interpreter in /usr/local/bin/python /app/.venv/bin/python; do
            docker run --rm --entrypoint "$interpreter" capi-provider-ssh-python:ci \
              -c 'import importlib.util; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("ensurepip") is None'
          done
          docker run --rm --entrypoint python capi-provider-ssh-python:ci \
            -c 'import sys, asyncssh, kopf, kubernetes, capi_provider_ssh; print(sys.version)'
          docker run --rm -e EXPECTED_PACKAGE_VERSION --entrypoint python capi-provider-ssh-python:ci \
            -c 'import os, importlib.metadata as m, capi_provider_ssh as p; d = m.distribution("capi-provider-ssh"); assert d.version == p.__version__ == os.environ["EXPECTED_PACKAGE_VERSION"]; assert d.metadata["License-Expression"] == "MPL-2.0"; license_file = next(f for f in d.files if str(f).endswith(".dist-info/licenses/LICENSE")); assert "Mozilla Public License" in d.locate_file(license_file).read_text()'

      - name: Scan validation image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: capi-provider-ssh-python:ci
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

  version:
    name: Validate release version calculation
    runs-on: ubuntu-latest
    outputs:
      major_minor_patch: ${{ steps.gitversion.outputs.MajorMinorPatch }}
      semver: ${{ steps.gitversion.outputs.SemVer }}
      package_version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.x
          preferLatestVersion: true

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
          overrideConfig: |
            update-build-number=false

      - name: Reject unresolved labels and invalid version tags
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          [[ "$SEMVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Set up Python for artifact verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate package identity, licenses and isolated sdist rebuild
        id: package
        env:
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
        run: |
          python3 python/scripts/check_package.py --version "$SEMVER"
          python3 -c 'import os, runpy; version = runpy.run_path("python/package_version.py")["normalize_version"](os.environ["SEMVER"]); print(f"version={version}")' >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and publish Python container
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_candidate &&
       github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop')
    needs: [validate, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version tag
        id: version
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
          MAJOR_MINOR_PATCH: ${{ needs.version.outputs.major_minor_patch }}
          SEMVER: ${{ needs.version.outputs.semver }}
        run: |
          if [[ "$BUILD_REF" == "refs/heads/main" ]]; then
            TAG="v${MAJOR_MINOR_PATCH}"
            # Release may already have created this commit's Git tag in parallel.
            # Preserve a previous release; allow either order for this release.
            TAG_COMMIT="$(git rev-parse --verify "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"
            if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$BUILD_SHA" ]]; then
              echo "::warning::Tag ${TAG} belongs to another commit — preserving its image tag"
              echo "tag=" >> "${GITHUB_OUTPUT}"
            else
              echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
            fi
          elif [[ "$BUILD_REF" == "refs/heads/develop" ]]; then
            echo "tag=${SEMVER}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=pr
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.vendor=Alpin Insight Solutions
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.url=https://github.com/alpininsight/capi-provider-ssh
            org.opencontainers.image.source=https://github.com/alpininsight/capi-provider-ssh
            org.opencontainers.image.documentation=https://github.com/alpininsight/capi-provider-ssh/tree/main/docs
            org.opencontainers.image.description=Cluster API infrastructure provider for SSH-reachable hosts
            org.opencontainers.image.version=${{ needs.version.outputs.semver }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./python
          file: ./python/Dockerfile
          build-args: |
            PROVIDER_VERSION=${{ needs.version.outputs.semver }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Build summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### Container Build Summary"
            echo "Image: ${{ env.IMAGE_NAME }}"
            echo "Version: $VERSION"
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Digest: $DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
