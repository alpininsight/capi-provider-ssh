name: E2E SSH Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC

concurrency:
  group: e2e-ssh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-ssh:
    name: E2E SSH (strato-vm2)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Write SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/e2e_key
          chmod 600 ~/.ssh/e2e_key

      - name: Run E2E SSH tests
        env:
          E2E_TESTS: "1"
          E2E_SSH_HOST: "217.154.172.8"
          E2E_SSH_KEY_PATH: ~/.ssh/e2e_key
        run: uv run pytest tests/e2e/ -v --timeout=120

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/e2e_key
