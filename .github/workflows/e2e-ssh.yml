name: E2E SSH Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC

concurrency:
  group: e2e-ssh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  configuration:
    name: External SSH lane configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
    steps:
      - name: Select external SSH lane
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_ENABLED: ${{ vars.E2E_SSH_ENABLED }}
        run: |
          set -euo pipefail
          enabled=true
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_ENABLED" != "true" ]]; then
            enabled=false
            echo "::notice::External SSH schedule is disabled; no SSH tests ran."
            {
              echo "### External SSH E2E: not run"
              echo "The schedule requires repository variable E2E_SSH_ENABLED=true."
              echo "Enable it only after configuring an approved disposable target and verified SSH trust."
              echo "This configuration result is not external SSH test or rollout acceptance."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  e2e-ssh:
    name: External SSH E2E
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    # Public-repository exception: the notebook runner pool is private-only.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - name: Verify approved target configuration
        working-directory: ${{ runner.temp }}
        env:
          E2E_SSH_HOST: ${{ vars.E2E_SSH_HOST }}
          E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in E2E_SSH_HOST E2E_SSH_PRIVATE_KEY E2E_SSH_KNOWN_HOSTS; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing approved external SSH test configuration: $key"
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Write SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/capi-e2e-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/capi-e2e-ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/capi-e2e-ssh/known_hosts"

      - name: Run E2E SSH tests
        env:
          E2E_TESTS: "1"
          E2E_SSH_HOST: ${{ vars.E2E_SSH_HOST }}
          E2E_SSH_USER: ${{ vars.E2E_SSH_USER || 'root' }}
          E2E_SSH_PORT: ${{ vars.E2E_SSH_PORT || '22' }}
          E2E_SSH_KEY_PATH: ${{ runner.temp }}/capi-e2e-ssh/key
          E2E_SSH_KNOWN_HOSTS_PATH: ${{ runner.temp }}/capi-e2e-ssh/known_hosts
        run: uv run pytest tests/e2e/ -v --timeout=120

      - name: Cleanup SSH key
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -f "$RUNNER_TEMP/capi-e2e-ssh/key" "$RUNNER_TEMP/capi-e2e-ssh/known_hosts"
