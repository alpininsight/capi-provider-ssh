---
name: Release

# Public-repository exception: GitHub does not allow this public caller to use
# the private organization workflow catalog. Keep this implementation aligned
# with .github-private/reusable-release.yml until a public reusable backend
# exists. Access behavior was verified in capi-provider-ssh PR #228.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.x
          preferLatestVersion: true

      - name: Calculate version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml
          overrideConfig: |
            update-build-number=false

      - name: Validate version metadata
        id: version
        env:
          VERSION: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid GitVersion MajorMinorPatch '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if GitHub Release already exists
        id: releasecheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.releasecheck.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$TAG" --generate-notes

      - name: Capture release state
        id: release_state
        env:
          EXISTS: ${{ steps.releasecheck.outputs.exists }}
        run: |
          if [[ "$EXISTS" == "true" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASED: ${{ steps.release_state.outputs.released }}
          SEMVER: ${{ steps.gitversion.outputs.SemVer }}
          FULL_SEMVER: ${{ steps.gitversion.outputs.FullSemVer }}
        run: |
          {
            echo "## GitVersion Release"
            echo ""
            echo "| Attribute | Value |"
            echo "|-----------|-------|"
            echo "| Version | $VERSION |"
            echo "| Tag | $TAG |"
            echo "| SemVer | $SEMVER |"
            echo "| FullSemVer | $FULL_SEMVER |"
            echo "| Created release | $RELEASED |"
          } >> "$GITHUB_STEP_SUMMARY"
