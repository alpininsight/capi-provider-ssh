# GitVersion 6.8 Configuration
# See: https://gitversion.net/docs/reference/configuration
mode: ManualDeployment
tag-prefix: '[vV]?'
next-version: 0.1.0
assembly-versioning-scheme: MajorMinorPatch
commit-message-incrementing: Enabled
major-version-bump-message: '(\+semver:\s?(breaking|major))|^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(.+\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '(\+semver:\s?(feature|minor))|^feat(\(.+\))?:'
patch-version-bump-message: '(\+semver:\s?(fix|patch))|^(fix|perf)(\(.+\))?:'
no-bump-message: '(\+semver:\s?(skip|none))|^(chore|docs|style|test|ci|build|revert)(\(.+\))?:'
branches:
  main:
    regex: ^main$
    mode: ManualDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
    is-release-branch: true
    is-main-branch: true
  develop:
    regex: ^develop$
    mode: ManualDeployment
    label: alpha
    increment: Minor
    prevent-increment:
      of-merged-branch: false
    track-merge-target: true
    is-release-branch: false
    is-main-branch: false
  feature:
    regex: ^(feature|feat)[/-](?<BranchName>.+)
    mode: ManualDeployment
    label: alpha.{BranchName}
    increment: Inherit
    source-branches: ['develop', 'main']
  hotfix:
    regex: ^hotfix[/-]
    mode: ManualDeployment
    label: beta
    increment: Patch
    source-branches: ['main']
  release:
    regex: ^release[/-]
    mode: ManualDeployment
    label: rc
    increment: None
    source-branches: ['develop']
  ci:
    regex: ^ci[/-](?<BranchName>.+)
    mode: ManualDeployment
    label: ci.{BranchName}
    increment: Inherit
    source-branches: ['develop']
  docs:
    regex: ^docs[/-](?<BranchName>.+)
    mode: ManualDeployment
    label: docs.{BranchName}
    increment: Inherit
    source-branches: ['develop']
  fix:
    regex: ^fix[/-](?<BranchName>.+)
    mode: ManualDeployment
    label: fix.{BranchName}
    increment: Inherit
    source-branches: ['develop']
  pull-request:
    source-branches: ['main', 'develop', 'feature', 'hotfix', 'release', 'ci', 'docs', 'fix']
