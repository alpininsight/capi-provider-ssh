[project]
name = "capi-provider-ssh"
dynamic = ["version"]
description = "Cluster API infrastructure provider for SSH-reachable hosts"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "kopf>=1.37,<2",
    "kubernetes>=32,<37",
    "asyncssh>=2.20,<3",
]

[project.urls]
Homepage = "https://github.com/alpininsight/capi-provider-ssh"
Documentation = "https://github.com/alpininsight/capi-provider-ssh/tree/main/docs"
Repository = "https://github.com/alpininsight/capi-provider-ssh"
Issues = "https://github.com/alpininsight/capi-provider-ssh/issues"
Changelog = "https://github.com/alpininsight/capi-provider-ssh/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "package_version.py"
expression = "get_version()"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.sdist]
include = ["capi_provider_ssh", "package_version.py", "hatch_build.py", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["capi_provider_ssh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as e2e tests requiring real SSH targets (deselect with '-m \"not e2e\"')",
    "kind: disposable multi-node CAPI/SSH/kubeadm lifecycle and failover lane",
    "nightly: marks tests for nightly CI only",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.15.2",
]
