apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sshmachines.infrastructure.alpininsight.ai
  labels:
    cluster.x-k8s.io/provider: infrastructure-ssh
    cluster.x-k8s.io/v1beta1: v1beta1
spec:
  group: infrastructure.alpininsight.ai
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                address:
                  type: string
                  description: SSH-reachable hostname or IP. Set directly or populated by the controller from an
                    SSHHost when hostSelector is used.
                port:
                  type: integer
                  default: 22
                  minimum: 1
                  maximum: 65535
                  description: SSH port.
                user:
                  type: string
                  default: root
                  description: SSH user for authentication.
                sshKeyRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: Name of the Secret containing the SSH private key.
                    key:
                      type: string
                      default: value
                      description: Key within the Secret that holds the private key data.
                hostSelector:
                  type: object
                  description: Label selector for SSHHost pool-based selection. When set, the controller claims
                    an available SSHHost matching these labels and copies its address/user/sshKeyRef.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: Labels that SSHHost CRs must match.
                hostRef:
                  type: string
                  description: Reference to the claimed SSHHost in namespace/name format. Set by the controller
                    when a host is claimed via hostSelector.
                externalEtcd:
                  type: object
                  description: Optional external etcd wiring. When set, the controller distributes certs and injects
                    kubeadm apiServer etcd args.
                  properties:
                    endpoints:
                      type: array
                      minItems: 1
                      items:
                        type: string
                      description: List of external etcd endpoints (for example https://10.0.0.10:2379).
                    caCertRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: value
                    clientCertRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: value
                    clientKeyRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: value
                    files:
                      type: object
                      properties:
                        caFile:
                          type: string
                          default: /etc/kubernetes/pki/etcd-external/ca.crt
                        certFile:
                          type: string
                          default: /etc/kubernetes/pki/etcd-external/client.crt
                        keyFile:
                          type: string
                          default: /etc/kubernetes/pki/etcd-external/client.key
                dryRun:
                  type: boolean
                  description: Validate prerequisites and authenticated SSH without bootstrap or reboot. Deletion
                    only cleans a UID-owned bootstrap previously started by this provider.
                bootstrapCheckStrategy:
                  type: string
                  default: ssh
                  enum:
                    - ssh
                    - none
                  description: Strategy for post-bootstrap host readiness validation. `ssh` runs kubelet readiness
                    checks via SSH (default). `none` skips host-side readiness checks after bootstrap execution.
                remediation:
                  type: object
                  properties:
                    reboot:
                      type: object
                      properties:
                        requestedAt:
                          type: string
                          format: date-time
                          description: Timestamp token used to request an in-band SSH reboot.
                providerID:
                  type: string
                  description: Provider ID in the format ssh://<address>.
                paused:
                  type: boolean
                  description: Indicates the resource is paused and will not be reconciled.
                sshHostKeyRef:
                  type: object
                  required:
                    - name
                  description: Verified OpenSSH known_hosts entries or host CA. Required for every SSH connection.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: known_hosts
            status:
              type: object
              properties:
                initialization:
                  type: object
                  properties:
                    provisioned:
                      type: boolean
                      description: True when the machine has been bootstrapped.
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - Hostname
                          - InternalIP
                          - ExternalIP
                      address:
                        type: string
                  description: Network addresses of the machine.
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                    required:
                      - type
                      - status
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                ready:
                  type: boolean
                  description: Legacy readiness flag for CAPI machine-controller compatibility (false during deletion, even after successful provisioning).
                failureReason:
                  type: string
                failureMessage:
                  type: string
                bootstrapDiagnostics:
                  type: object
                  properties:
                    phase:
                      type: string
                      description: Bootstrap phase inferred from output signatures (reset/init/join/unknown).
                    exitCode:
                      type: integer
                      description: Exit code returned by the bootstrap script command.
                    stderrExcerpt:
                      type: string
                      description: Sanitized stderr/stdout excerpt for concise failure triage.
                remediation:
                  type: object
                  properties:
                    reboot:
                      type: object
                      properties:
                        lastRequestedAt:
                          type: string
                        lastCompletedAt:
                          type: string
                          format: date-time
                        success:
                          type: boolean
                        message:
                          type: string
                        phase:
                          type: string
                          enum:
                            - Prepared
                            - Submitted
                            - Succeeded
                            - Failed
                            - Unknown
                        startedAt:
                          type: string
                          format: date-time
                        previousBootID:
                          type: string
                        observedBootID:
                          type: string
                allocation:
                  type: object
                  required:
                    - machineUID
                    - address
                    - port
                  properties:
                    address:
                      type: string
                      description: SSH-reachable hostname or IP. Set directly or populated by the controller from
                        an SSHHost when hostSelector is used.
                    port:
                      type: integer
                      default: 22
                      minimum: 1
                      maximum: 65535
                      description: SSH port.
                    user:
                      type: string
                      default: root
                      description: SSH user for authentication.
                    sshKeyRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the Secret containing the SSH private key.
                        key:
                          type: string
                          default: value
                          description: Key within the Secret that holds the private key data.
                    sshHostKeyRef:
                      type: object
                      required:
                        - name
                      description: Verified OpenSSH known_hosts entries or host CA. Required for every SSH connection.
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: known_hosts
                    hostRef:
                      type: string
                      description: Reference to the claimed SSHHost in namespace/name format. Set by the controller
                        when a host is claimed via hostSelector.
                    machineUID:
                      type: string
                    hostUID:
                      type: string
                bootstrapOwnership:
                  type: object
                  required:
                    - machineUID
                    - address
                    - port
                  properties:
                    address:
                      type: string
                      description: SSH-reachable hostname or IP. Set directly or populated by the controller from
                        an SSHHost when hostSelector is used.
                    port:
                      type: integer
                      default: 22
                      minimum: 1
                      maximum: 65535
                      description: SSH port.
                    user:
                      type: string
                      default: root
                      description: SSH user for authentication.
                    sshKeyRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                          description: Name of the Secret containing the SSH private key.
                        key:
                          type: string
                          default: value
                          description: Key within the Secret that holds the private key data.
                    sshHostKeyRef:
                      type: object
                      required:
                        - name
                      description: Verified OpenSSH known_hosts entries or host CA. Required for every SSH connection.
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: known_hosts
                    hostRef:
                      type: string
                      description: Reference to the claimed SSHHost in namespace/name format. Set by the controller
                        when a host is claimed via hostSelector.
                    machineUID:
                      type: string
                    hostUID:
                      type: string
                    startedAt:
                      type: string
                      format: date-time
                cleanup:
                  type: object
                  properties:
                    phase:
                      type: string
                      enum:
                        - Running
                        - Succeeded
                        - Failed
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: ProviderID
          type: string
          jsonPath: .spec.providerID
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: sshmachines
    singular: sshmachine
    kind: SSHMachine
    shortNames:
      - sshm
    categories:
      - cluster-api
